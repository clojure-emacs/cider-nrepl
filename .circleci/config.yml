version: 2.1

# Default settings for executors

defaults: &defaults
  working_directory: ~/repo
  environment:
    # NOTE: the Clojure CLI honors JAVA_OPTS, not JVM_OPTS (a Leiningen
    # convention), so the previous JVM_OPTS was silently ignored. With no heap
    # cap, JDK 11 - which lacks the cgroup memory-limit detection that JDK 17+
    # have - sized its heap off the host's RAM and got OOM-killed inside the
    # container. An explicit -Xmx applies regardless of cgroup detection.
    JAVA_OPTS: >
      -Xmx2500m
      -Dclojure.main.report=stderr

# Runners for various OpenJDK versions, using the tools-deps (clojure CLI) images.

executors:
  jdk8:
    docker:
      - image: clojure:temurin-8-noble
    <<: *defaults
  jdk11:
    docker:
      - image: clojure:temurin-11-noble
    <<: *defaults
  jdk17:
    docker:
      - image: clojure:temurin-17-noble
    <<: *defaults
  jdk21:
    docker:
      - image: clojure:temurin-21-noble
    <<: *defaults
  jdk25:
    docker:
      - image: clojure:temurin-25-noble
    <<: *defaults
  jdk26:
    docker:
      - image: clojure:temurin-26-noble
    <<: *defaults

# Runs a given set of steps, with some standard pre- and post-
# steps, including restoring of cache, saving of cache.
#
# Adapted from https://github.com/lambdaisland/meta/blob/master/circleci/clojure_orb.yml

commands:
  with_cache:
    description: |
      Run a set of steps with Maven dependencies and Clojure classpath cache
      files cached.
      This command restores ~/.m2, ~/.gitlibs and .cpcache if they were
      previously cached, then runs the provided steps, and finally saves the
      cache. The cache key is generated from the contents of the dependency
      files; when no cache matches it exactly, the most recent cache for the
      same cache_version is restored instead, so only the changed deps get
      downloaded.
    parameters:
      steps:
        type: steps
      files:
        description: Files to consider when creating the cache key
        type: string
        default: "deps.edn build/main.clj test/smoketest/deps.edn"
      cache_version:
        type: string
        description: "Change this value to force a cache update"
        default: "1"
    steps:
      - run:
          name: Generate Cache Checksum
          command: cat << parameters.files >> | sha256sum | awk '{print $1}' > /tmp/clojure_cache_seed
      - restore_cache:
          keys:
            - clojure-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}
            - clojure-<< parameters.cache_version >>-
      - steps: << parameters.steps >>
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
            - .cpcache
            - base-jdk-src.zip
          key: clojure-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}

  prepare_deps:
    description: |
      Resolve the dependencies for the build tooling and the given alias specs
      up front, retrying on failure. Computing a classpath occasionally dies
      with a ClassCastException from HashMap internals: Maven's model validator
      caches the coordinates it has validated in an unsynchronized HashSet,
      and tools.deps resolves on several threads at once. It strikes whenever
      .cpcache misses, and a retry is all it takes. The specs carry their
      -M/-X, because the CLI keys its classpath cache on that as well.
    parameters:
      aliases:
        description: |
          Space-separated alias specs to prepare, e.g. "-X:1.12:test -M:kondo"
        type: string
    steps:
      - run:
          name: Preparing dependencies
          command: |
            prepare() {
              clojure -P -T:build || return 1
              for spec in << parameters.aliases >>; do
                clojure -P "$spec" || return 1
              done
            }
            attempt=1
            until prepare; do
              if [ "$attempt" -ge 3 ]; then
                echo "Giving up after $attempt attempts."
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Resolving dependencies failed, retrying..."
              sleep 5
            done

jobs:

  lint:
    description: |
      Running linters
    executor: jdk26
    environment:
      CLOJURE_VERSION: "1.12"
    steps:
      - checkout
      - with_cache:
          cache_version: "lint_v1"
          steps:
            - prepare_deps:
                aliases: "-M:cljfmt -M:kondo -M:inlined-deps:cljs:test:eastwood -M:1.12:nrepl-1.7:inlined-deps:test"
            - run:
                name: Running cljfmt
                command: make cljfmt
            - run:
                name: Running clj-kondo
                command: make kondo
            - run:
                name: Running Eastwood
                command: make eastwood
            - run:
                name: Checking the descriptor return contract
                command: make descriptor-contract

  deploy:
    # JDK 8 is preferred for deployments, to keep the bundled Java classes
    # (e.g. cljfmt's diffutils, repackaged by mranderson) JDK 8 compatible.
    executor: jdk8
    steps:
      - checkout
      - run:
          name: Deploy
          command: make deploy

  test:
    description: |
      Run quick tests (against the non-inlined dependencies)
    parameters:
      jdk_version:
        type: string
      clojure_version:
        type: string
      nrepl_version:
        type: string
        default: "1.7"
    executor: << parameters.jdk_version >>
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
      JDK_SRC_VERSION: << parameters.jdk_version >>
      NREPL_VERSION: << parameters.nrepl_version >>
    steps:
      - checkout
      - with_cache:
          cache_version: "test_v1_<< parameters.clojure_version >>_<< parameters.jdk_version >>_<< parameters.nrepl_version >>"
          steps:
            - prepare_deps:
                aliases: "-X:<< parameters.clojure_version >>:nrepl-<< parameters.nrepl_version >>:inlined-deps:test"
            - run:
                name: Running quick tests
                command: make quick-test

  test-cljs:
    description: |
      Run the ClojureScript middleware tests (JDK21+ only, since CLJS 1.12's
      Closure compiler requires a recent JDK)
    parameters:
      jdk_version:
        type: string
      clojure_version:
        type: string
    executor: << parameters.jdk_version >>
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
      JDK_SRC_VERSION: << parameters.jdk_version >>
    steps:
      - checkout
      - run: apt-get update && apt-get install -y nodejs
      - with_cache:
          cache_version: "cljs_test_v1_<< parameters.clojure_version >>_<< parameters.jdk_version >>"
          steps:
            - prepare_deps:
                aliases: "-X:cljs:<< parameters.clojure_version >>:nrepl-1.7:inlined-deps:test"
            - run:
                name: Running ClojureScript tests
                command: make cljs-test

  full-test:
    description: |
      Run the full suite against the inlined/shaded dependencies, plus the smoketest
    parameters:
      jdk_version:
        type: string
      clojure_version:
        type: string
    executor: << parameters.jdk_version >>
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
      JDK_SRC_VERSION: << parameters.jdk_version >>
      PROJECT_VERSION: 999.99.9
    steps:
      - checkout
      - with_cache:
          cache_version: "full_test_v1_<< parameters.clojure_version >>_<< parameters.jdk_version >>"
          steps:
            - prepare_deps:
                aliases: "-X:<< parameters.clojure_version >>:nrepl-1.7:inlined:test"
            - run:
                name: Running tests with inlined deps
                command: make inlined-test
            - run:
                name: Running smoketest
                command: make smoketest

run_always: &run_always
  filters:
    branches:
      only: /.*/
    tags:
      only: /.*/

workflows:
  version: 2.1
  ci-test-matrix:
    jobs:
      - full-test:
          # Full (inlined) tests against latest Clojure and fringe JDKs.
          matrix:
            alias: "full-test"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk8, jdk26]
          <<: *run_always
      - test:
          matrix:
            alias: "test-1.12"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk8, jdk11, jdk17, jdk21, jdk25, jdk26]
          <<: *run_always
      - test:
          matrix:
            alias: "test-1.13"
            parameters:
              # Clojure 1.13 bumped min JDK requirement to 17
              clojure_version: ["1.13"]
              jdk_version: [jdk17, jdk21, jdk25, jdk26]
          <<: *run_always
      - test:
          # Test older Clojure versions only against fringe JDK versions.
          matrix:
            alias: "test-older"
            parameters:
              clojure_version: ["1.10", "1.11"]
              jdk_version: [jdk8, jdk26]
          <<: *run_always
      - test:
          # Test against multiple nREPL versions.
          matrix:
            alias: "test-nrepl"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk26]
              nrepl_version: ["1.0", "1.3", "1.4", "1.5", "1.6", "1.7"]
          <<: *run_always
      - test-cljs:
          # ClojureScript tests only run on JDK21+ (CLJS 1.12 Closure needs it).
          matrix:
            alias: "test-cljs"
            parameters:
              clojure_version: ["1.12"]
              jdk_version: [jdk21, jdk25, jdk26]
          <<: *run_always
      - lint:
          <<: *run_always
      - deploy:
          requires:
            - full-test
            - test-1.12
            - test-1.13
            - test-older
            - test-nrepl
            - test-cljs
            - lint
          # Releases, prereleases and snapshots all go through the same gate: the
          # whole matrix has to be green first. A vX.Y.Z-SNAPSHOT tag is the way
          # to exercise the full release path without cutting a release.
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\d+)?$/
                - /^v\d+\.\d+\.\d+-SNAPSHOT$/
